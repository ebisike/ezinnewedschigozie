<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — RSVP Dashboard | Ezinne &amp; Chigozie</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ============ PASSCODE GATE ============ -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-ornament"><i class="bi bi-shield-lock-fill"></i></div>
      <h1 class="gate-title">Admin Dashboard</h1>
      <p class="gate-sub">Ezinne &amp; Chigozie — RSVP Management</p>
      <form id="gateForm" novalidate>
        <label for="passcode" class="form-label">Enter passcode</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
          <input type="password" id="passcode" class="form-control" inputmode="numeric" autocomplete="off" required />
          <button type="submit" class="btn btn-gate-submit">Unlock</button>
        </div>
        <div class="gate-error" id="gateError" hidden>
          <i class="bi bi-exclamation-triangle-fill me-1"></i>Wrong passcode. Try again.
        </div>
      </form>
      <p class="gate-hint">This area is for the couple and their team only.</p>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div id="dashboard" hidden>
    <nav class="admin-nav">
      <div class="container-fluid">
        <div class="admin-nav-inner">
          <span class="admin-brand"><i class="bi bi-heart-fill me-2"></i>E &amp; C — RSVP Dashboard</span>
          <div class="admin-nav-actions">
            <span class="admin-count-badge" id="countBadge">0 submissions</span>
            <button class="btn btn-admin-refresh" id="refreshBtn" type="button" title="Refresh">
              <i class="bi bi-arrow-clockwise"></i> <span class="btn-label">Refresh</span>
            </button>
            <button class="btn btn-admin-export" id="exportBtn" type="button" title="Export CSV">
              <i class="bi bi-download"></i> <span class="btn-label">Export CSV</span>
            </button>
            <button class="btn btn-admin-lock" id="lockBtn" type="button" title="Lock">
              <i class="bi bi-lock-fill"></i> <span class="btn-label">Lock</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Summary cards -->
    <div class="container-fluid admin-summary">
      <div class="row g-3">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <i class="bi bi-people-fill"></i>
            <div><strong id="statTotal">0</strong><span>Total RSVPs</span></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card stat-attending">
            <i class="bi bi-check-circle-fill"></i>
            <div><strong id="statAttending">0</strong><span>Attending</span></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card stat-declined">
            <i class="bi bi-x-circle-fill"></i>
            <div><strong id="statDeclined">0</strong><span>Declined</span></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card stat-latest">
            <i class="bi bi-clock-history"></i>
            <div><strong id="statLatest">—</strong><span>Latest submission</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Search/filter -->
    <div class="container-fluid admin-toolbar">
      <div class="input-group admin-search">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" placeholder="Search name, phone, country…" />
      </div>
      <select id="filterSelect" class="form-select admin-filter">
        <option value="all">All responses</option>
        <option value="yes">Attending only</option>
        <option value="no">Declined only</option>
      </select>
    </div>

    <!-- Table -->
    <div class="container-fluid admin-table-wrap">
      <div class="table-responsive admin-table-scroll">
        <table class="table admin-table align-middle" id="rsvpTable">
          <thead>
            <tr>
              <th scope="col" class="th-idx">#</th>
              <th scope="col">Name</th>
              <th scope="col">Phone</th>
              <th scope="col" class="th-attending">Attending</th>
              <th scope="col" class="th-country">Country</th>
              <th scope="col" class="th-state">State</th>
              <th scope="col" class="th-message">Message</th>
              <th scope="col">Submitted</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="admin-empty-row"><td colspan="8">Loading submissions…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase (compat build) — RSVP storage -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/admin.js"></script>
</body>
</html>
